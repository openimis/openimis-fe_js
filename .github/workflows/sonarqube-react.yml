name: SonarQube Scan - React

on:
  push:
    branches:
      - develop
      - 'feature*'
      - 'release/**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
      - 'feature*'
      - 'release/**'

jobs:
  sonarqube:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: 'openimis-fe_js/package-lock.json'

      - name: Install dependencies
        run: cd openimis-fe_js && npm ci

      - name: Run tests with SonarQube reporter
        run: cd openimis-fe_js && npm run test:sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        with:
          args: >
            -Dsonar.projectKey=openIMIS_React
            -Dsonar.projectName=openIMIS-React
            -Dsonar.sources=openimis-fe_js/src
            -Dsonar.exclusions=**/*.test.js,**/*.test.jsx,**/node_modules/**,**/build/**
            -Dsonar.coverage.exclusions=**/*.test.js,**/*.test.jsx
            -Dsonar.javascript.lcov.reportPaths=openimis-fe_js/coverage/lcov.info
            -Dsonar.testExecutionReportPaths=openimis-fe_js/jest-sonar-report.xml
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_LOGIN: ${{ secrets.SONAR_LOGIN_REACT }}

      - name: SonarQube Quality Gate
        id: sonarqube-quality-gate
        uses: SonarSource/sonarqube-quality-gate-action@master
        timeout-minutes: 5
        env:
          SONAR_LOGIN: ${{ secrets.SONAR_LOGIN_REACT }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

      - name: Quality Gate Status
        if: steps.sonarqube-quality-gate.outcome != 'success'
        run: exit 1
