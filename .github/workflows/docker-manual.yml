name: create manual docker image 
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker tag(s), comma or space separated, e.g. "26.10.1, 26.10"'
        required: true
      build_mode:
        description: 'Build mode (prod for minified, dev for unminified)'
        required: false
        default: 'prod'
        type: choice
        options:
        - prod
        - dev
      file_url:
        description: 'url (CURL compatible) of your custom openIMIS.json'
        required: false
jobs:
  publish-manual-docker-image:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Download custom openimis.json
      if: ${{ inputs.file_url != '' }}
      run: |
          curl -o ./openimis.json ${{ inputs.file_url }}
    - name: Set build mode
      run: |
        if [ "${{ github.event.inputs.build_mode }}" = "dev" ]; then
          echo "MODE=development" >> $GITHUB_ENV
        else
          echo "MODE=production" >> $GITHUB_ENV
        fi
    - name: Build the openimis frontend Docker image
      env:
        TAGS: ${{ github.event.inputs.tag }}
      run: |
         # one build, pushed under every tag of the comma or space separated list
         read -ra tags <<< "${TAGS//,/ }"
         if [ ${#tags[@]} -eq 0 ]; then echo "::error::no tag given"; exit 1; fi
         for t in "${tags[@]}"; do
           if ! [[ "$t" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then echo "::error::invalid docker tag: $t"; exit 1; fi
         done
         docker build . --no-cache --build-arg MODE=$MODE --tag ghcr.io/openimis/openimis-fe:${tags[0]}
         for t in "${tags[@]:1}"; do docker tag ghcr.io/openimis/openimis-fe:${tags[0]} ghcr.io/openimis/openimis-fe:$t; done
         for t in "${tags[@]}"; do docker push ghcr.io/openimis/openimis-fe:$t; done
