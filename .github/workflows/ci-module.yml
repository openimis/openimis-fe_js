name: Automated CI testing for modules

on:
  workflow_call:
    inputs:
      module-path:
        required: true
        type: string
      repo:
        required: true
        type: string

jobs:
  test-module:
    name: Test ${{ inputs.repo }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - name: Checkout module repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.repo }}
          path: current-module
          fetch-depth: 0

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Yarn
        run: npm install -g yarn

      - name: Install dependencies
        run: yarn install
        working-directory: ${{ inputs.module-path }}

      - name: Run linter
        run: yarn lint --if-present
        working-directory: ${{ inputs.module-path }}

      - name: Run tests
        run: yarn test:ci
        working-directory: ${{ inputs.module-path }}
