name: Automated CI testing for Assembly

on:
  push:
    branches:
      - develop
      - 'feature/**'
      - 'release/**'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - develop
      - 'feature/**'
      - 'release/**'

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: 'openimis-fe_js/package-lock.json'

      - name: Install dependencies
        run: cd openimis-fe_js && npm ci

      - name: Run linter
        run: cd openimis-fe_js && npm run lint --if-present

      - name: Run tests with coverage
        run: cd openimis-fe_js && npm run test:ci

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./openimis-fe_js/coverage/lcov.info
          flags: react
          name: react-coverage
          fail_ci_if_error: false

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: react-test-results-${{ matrix.node-version }}
          path: |
            openimis-fe_js/coverage/
            openimis-fe_js/jest-results.json

      - name: Comment PR with coverage
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: ./openimis-fe_js/coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}
